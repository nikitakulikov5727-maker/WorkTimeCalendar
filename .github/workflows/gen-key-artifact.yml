name: Gen Key Artifact

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias workcalendar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass WorkCalendar2026 \
            -keypass WorkCalendar2026 \
            -dname "CN=WorkTimeCalendar, OU=Mobile, O=Personal, L=City, S=Region, C=RU"

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-file
          path: release.keystore
