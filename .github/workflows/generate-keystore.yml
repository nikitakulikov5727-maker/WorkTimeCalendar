name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore and Base64
        run: |
          STORE_PASS="WorkCalendarStore2026!"
          KEY_PASS="WorkCalendarKey2026!"
          ALIAS="workcalendar"

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=WorkTimeCalendar, OU=Mobile, O=Personal, L=City, S=Region, C=RU"

          echo "=== KEYSTORE_BASE64 START ==="
          base64 -w 0 release.keystore
          echo ""
          echo "=== KEYSTORE_BASE64 END ==="
          echo "KEYSTORE_PASSWORD=$STORE_PASS"
          echo "KEY_ALIAS=$ALIAS"
          echo "KEY_PASSWORD=$KEY_PASS"
